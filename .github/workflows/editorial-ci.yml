name: Xientia Editorial CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: editorial-ci-${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  editorial-validation:
    name: Editorial contract and regression tests
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Install editorial dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            python3 \
            python3-venv \
            python3-uno \
            python3-yaml \
            python3-lxml \
            libreoffice-writer \
            pandoc \
            git \
            ca-certificates \
            fonts-dejavu-core \
            fonts-liberation

          /usr/bin/python3 -m venv \
            --system-site-packages /tmp/xientia-ci-venv

          /tmp/xientia-ci-venv/bin/python -m pip install \
            "PyMuPDF==1.26.7"

      - name: Inspect environment
        run: |
          python3 --version
          libreoffice --version
          pandoc --version
          /tmp/xientia-ci-venv/bin/python -c \
            "import uno, yaml, pymupdf, lxml; print('DEPENDENCIES: OK')"

      - name: Validate editorial CI contract
        run: |
          /tmp/xientia-ci-venv/bin/python \
            tools/editorial/ci/validate_ci_contract.py \
            --contract \
            tools/editorial/ci/editorial_ci_contract.json

      - name: Run editorial regression suite
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          /tmp/xientia-ci-venv/bin/python -m unittest discover \
            -s tools/editorial/tests \
            -v

      - name: Build and verify consultation editions on main
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          set -eu

          for volume in XV-001 XEP-0000; do
            output="/tmp/xientia-f43-main-${volume}"

            /tmp/xientia-ci-venv/bin/python \
              tools/editorial/render_library.py \
              --repo "$GITHUB_WORKSPACE" \
              --volume "$volume" \
              --out "$output" \
              --validate-publish \
              --publish-with-evidence

            VOLUME="$volume" OUTPUT="$output" \
              /tmp/xientia-ci-venv/bin/python - <<'PY'
          import json
          import os
          import sys
          from pathlib import Path

          repo = Path(os.environ["GITHUB_WORKSPACE"])
          root = Path(os.environ["OUTPUT"])
          volume = os.environ["VOLUME"]

          sys.path.insert(
              0, str(repo / "tools/editorial/ci")
          )

          from evidence_verify import verify_package

          evidence = json.loads(
              (root / "evidence.json").read_text(encoding="utf-8")
          )

          result = verify_package(repo, root, evidence)

          assert result["document"] == volume
          assert result["artifacts_verified"] == 3
          assert evidence["status"] == "draft"
          assert evidence["institutional_adoption"] is False

          print(f"{volume}: MAIN CI EVIDENCE VERIFIED")
          PY
          done
